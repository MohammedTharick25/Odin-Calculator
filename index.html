<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="page-container">
      <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
          <button class="btn">7</button>
          <button class="btn">8</button>
          <button class="btn">9</button>
          <button class="btn operator">/</button>

          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">6</button>
          <button class="btn operator">*</button>

          <button class="btn">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn operator">-</button>

          <button class="btn">0</button>
          <button class="btn decimal">.</button>
          <button class="btn operator">+</button>
          <button class="btn clear">C</button>
          <button class="btn equals">=</button>
          <button class="btn backspace">←</button>
        </div>
      </div>
      <footer>
        <p><b>Made By Tharick!</b></p>
        <div class="footer-socials">
          <a
            href="https://www.instagram.com/md_tharick22/"
            target="_blank"
            class="social-link"
            aria-label="Instagram"
            ><i class="fab fa-instagram"></i
          ></a>
          <a
            href="https://www.facebook.com/md.tharick/"
            target="_blank"
            class="social-link"
            aria-label="Facebook"
            ><i class="fab fa-facebook"></i
          ></a>
          <a
            href="https://x.com/a_tharick52871"
            target="_blank"
            class="social-link"
            aria-label="X (Twitter)"
            ><i class="fab fa-x-twitter"></i
          ></a>
          <a
            href="https://github.com/MohammedTharick25"
            target="_blank"
            class="social-link"
            aria-label="GitHub"
            ><i class="fab fa-github"></i
          ></a>
          <a
            href="https://www.linkedin.com/in/mdtharick/"
            target="_blank"
            class="social-link"
            aria-label="LinkedIn"
            ><i class="fab fa-linkedin"></i
          ></a>
        </div>
      </footer>
    </div>

    <script src="index.js"></script>
  </body>
</html>
